
name: Build Khaled Soot Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q ./*.zip -d extracted

      - name: Build Android APK
        run: |
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Khaled-Soot-Studio-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
